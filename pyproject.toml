[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-websearch"
version = "0.1.0"
description = "Pluggable multi-provider web search with ordered fallback (Ollama, Tavily, Brave, SearXNG) + Open WebUI external endpoint"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "multi-websearch" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "fastmcp>=0.1.0",
]


[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
multi-websearch = "multi_websearch.cli:main"
multi-websearch-server = "multi_websearch.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multi_websearch*"]

[tool.ruff]
line-length = 100
target-version = "py310"