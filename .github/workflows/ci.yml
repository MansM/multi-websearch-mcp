name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Lint & tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest tests/ -v

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t multi-websearch:ci .

      - name: Smoke test (server starts, /health responds)
        run: |
          docker run -d --name mws -p 8018:8018 multi-websearch:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8018/health >/dev/null; then ok=1; break; fi
            sleep 2
          done
          docker logs mws
          if [ -z "$ok" ]; then
            echo "::error::/health did not respond within 60s"
            exit 1
          fi
          docker inspect --format='health: {{.State.Health.Status}}' mws
